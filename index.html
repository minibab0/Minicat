<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 아이패드/스마트폰 화면 대응 -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>minicat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">

        <!-- 흐린 GIF 배경 -->
        <div id="gif-background"></div>

        <!-- 실제 게임 화면 -->
        <canvas id="game"></canvas>

        <!-- 상단 정보 -->
        <div id="ui">
            <div class="game-title">MINICAT</div>

            <div class="status">
                🐟 <span id="score">0</span>
                &nbsp;&nbsp;
                ❤️ <span id="lives">3</span>
            </div>
        </div>

        <!-- 조작 버튼 -->
        <div id="controls">

            <div class="move-buttons">
                <button id="leftButton">◀</button>
                <button id="rightButton">▶</button>
            </div>

            <button id="jumpButton">▲</button>

        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
